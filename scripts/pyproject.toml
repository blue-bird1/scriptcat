[project]
name = "scriptcat-build-tools"
version = "0.1.0"
description = "Local ScriptCat extension and MCP publication with remote browser provider tooling"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]
